[project]
name = "nws-h3-impacts"
version = "0.1.0"
description = "H3-based impact analysis for NWS hazards and NDFD forecasts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h3>=4.0",
    "h3ronpy>=0.22",
    "geopandas>=1.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "polars>=1.0",
    "rasterio>=1.3",
    "xarray>=2024.0",
    "cfgrib>=0.9",
    "shapely>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "ipykernel",
    "jupyter",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
